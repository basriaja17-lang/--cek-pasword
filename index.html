<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLOT IBAZ - Main Seru</title>
<style>
body{margin:0;font-family:Arial;background:#1a1a2e;color:white;text-align:center;padding:20px}
h1{color:#ffd700;font-size:32px;margin:10px}
.box{background:white;color:#333;border-radius:20px;padding:20px;max-width:400px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.slot{display:flex;justify-content:center;gap:10px;margin:20px 0}
.reel{font-size:60px;background:#f0f0f0;width:90px;height:90px;display:flex;align-items:center;justify-content:center;border-radius:15px;border:3px solid #ffd700}
#koin{font-size:22px;font-weight:bold;color:#1a1a2e}
button{background:#ffd700;border:none;padding:15px 40px;font-size:22px;font-weight:bold;border-radius:50px;cursor:pointer;margin-top:10px}
button:active{transform:scale(.95)}
#hasil{font-size:20px;font-weight:bold;margin-top:15px;min-height:30px}
.menang{color:green}
.kalah{color:red}
</style>
</head>
<body>
<h1>🎰 SLOT IBAZ 🎰</h1>
<p>Main seru-seruan aja, pake koin pura-pura!</p>
<div class="box">
<div id="koin">🪙 Koin: <span id="saldo">100</span></div>
<div class="slot">
<div class="reel" id="r1">🍒</div>
<div class="reel" id="r2">🍋</div>
<div class="reel" id="r3">🍇</div>
</div>
<button onclick="putar()">SPIN! 🎲</button>
<div id="hasil">Ayo putar!</div>
<button onclick="reset()" style="background:#ddd;font-size:14px;padding:8px 20px">Reset Koin</button>
</div>
<p style="font-size:12px;opacity:.7">Dibuat oleh Ibaz • Hanya untuk hiburan</p>
<script>
let saldo = 100;
let buah = ["🍒","🍋","🍇","🍊","⭐","💎","7️⃣"];
function putar(){
if(saldo <= 0){document.getElementById("hasil").innerHTML="<span class='kalah'>Koin habis! Klik Reset Koin</span>";return;}
saldo -= 10;
let a = buah[Math.floor(Math.random()*buah.length)];
let b = buah[Math.floor(Math.random()*buah.length)];
let c = buah[Math.floor(Math.random()*buah.length)];
document.getElementById("r1").innerText=a;
document.getElementById("r2").innerText=b;
document.getElementById("r3").innerText=c;
let hasil = document.getElementById("hasil");
if(a===b && b===c){
  let menang = a==="💎"?100: a==="7️⃣"?80:50;
  saldo+=menang;
  hasil.innerHTML="<span class='menang'>🎉 JACKPOT! +"+menang+" Koin!</span>";
} else if(a===b || b===c || a===c){
  saldo+=20;
  hasil.innerHTML="<span class='menang'>Lumayan! 2 sama +20 Koin</span>";
} else {
  hasil.innerHTML="<span class='kalah'>Belum beruntung, coba lagi!</span>";
}
document.getElementById("saldo").innerText=saldo;
}
function reset(){saldo=100;document.getElementById("saldo").innerText=saldo;document.getElementById("hasil").innerText="Koin di-reset! Ayo main lagi!";}
</script>
</body>
</html>
