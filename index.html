<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petani Ke Sawah</title>
<style>
body{margin:0;overflow:hidden;font-family:Arial;background:linear-gradient(#87CEEB,#E0F6FF);height:100vh}
.matahari{position:absolute;top:30px;left:50px;font-size:80px;animation:naik 3s infinite alternate}
@keyframes naik{from{transform:translateY(0)}to{transform:translateY(15px)}}
.awan{position:absolute;font-size:60px;animation:jalanAwan 20s linear infinite}
.a1{top:20px;left:-100px}
.a2{top:80px;left:-200px;animation-delay:5s}
@keyframes jalanAwan{to{left:110%}}
.burung{position:absolute;top:100px;font-size:30px;animation:terbang 8s linear infinite}
@keyframes terbang{0%{left:-50px}100%{left:110%}}
.gunung{position:absolute;bottom:120px;left:0;width:100%;font-size:100px;letter-spacing:-10px}
.sawah{position:absolute;bottom:0;width:100%;height:130px;background:linear-gradient(#4CAF50,#2E7D32);border-top:5px solid #8D6E63}
.pematang{position:absolute;bottom:100px;width:100%;height:15px;background:#8D6E63}
.petani{position:absolute;bottom:115px;left:-100px;font-size:80px;animation:jalan 12s linear infinite}
@keyframes jalan{0%{left:-100px}50%{transform:scaleX(1)}100%{left:110%}}
.kaki{animation:goyang .5s infinite alternate;display:inline-block}
@keyframes goyang{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.teks{position:absolute;top:180px;width:100%;text-align:center;font-size:24px;font-weight:bold;color:#333;text-shadow:1px 1px #fff}
.sub{font-size:15px;font-weight:normal}
</style>
</head>
<body>
<div class="matahari">☀️</div>
<div class="awan a1">☁️☁️</div>
<div class="awan a2">☁️</div>
<div class="burung">🕊️ 🕊️</div>
<div class="teks">🌾 PETANI KE SAWAH 🌾<br><span class="sub">Pagi-pagi Pak Tani berangkat kerja...</span></div>
<div class="gunung">⛰️⛰️⛰️⛰️⛰️</div>
<div class="pematang"></div>
<div class="sawah"></div>
<div class="petani"><span class="kaki">👨🏽‍🌾</span></div>
<div style="position:absolute;bottom:10px;width:100%;text-align:center;color:#fff;font-weight:bold">🌱🌱🌱🌱🌱🌱🌱🌱🌱</div>
</body>
</html>
